name: CI Tests

# The test matrix, callable from both the PR/push workflow and the release gate so the
# two can never drift apart. Publishing to nuget.org is irreversible, so the release
# must run exactly the checks a pull request runs - not a copy of them.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  dotnet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      ContinuousIntegrationBuild: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # WebLogic references CodeLogic and CodeLogic.* from nuget.org only - no sibling
      # source clones are needed, so this repository builds on its own.
      - name: Build
        run: dotnet build CL.WebLogic2.slnx --configuration Release

      - name: Test
        run: dotnet test CL.WebLogic2.slnx --configuration Release --no-build --logger "console;verbosity=normal"
        env:
          # The browser suite (/_weblogic/tests) runs in this Chrome; the test is skipped without one.
          CHROME_PATH: ${{ matrix.os == 'ubuntu-latest' && '/usr/bin/google-chrome' || 'C:\Program Files\Google\Chrome\Application\chrome.exe' }}

  samples:
    # The deployable demo, end to end: the toolkit is packed and both sample images are built
    # against the package (samples/docker/Dockerfile), the stack runs in Production with MySQL and
    # Mailpit, and smoke.py drives every flow (forms, 2FA, API keys, SSE, caching, the admin plugin).
    # Then everything restarts and the checks run again against the persisted state.
    runs-on: ubuntu-latest
    env:
      STARTER_ADMIN_PASSWORD: Ci-Starter-Operator-1
      MINIBLOG_ADMIN_PASSWORD: Ci-Northwind-Journal-1
      MINIBLOG_PASSWORD_PEPPER: ci-pepper-not-a-secret-0123456789
    defaults:
      run:
        working-directory: samples/docker
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 240

      - name: Smoke test
        run: |
          python3 smoke.py starter http://localhost:5080 --mailpit http://localhost:8025 --admin-password "$STARTER_ADMIN_PASSWORD"
          python3 smoke.py miniblog http://localhost:5081 --admin-password "$MINIBLOG_ADMIN_PASSWORD"

      - name: Restart and test again (persistence)
        run: |
          docker compose restart starter miniblog
          docker compose up -d --wait --wait-timeout 240
          python3 smoke.py starter http://localhost:5080 --mailpit http://localhost:8025 --admin-password "$STARTER_ADMIN_PASSWORD"
          python3 smoke.py miniblog http://localhost:5081 --admin-password "$MINIBLOG_ADMIN_PASSWORD"

      - name: Logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  client:
    # DOM-free client modules under Node's built-in test runner (no npm install: zero dependencies).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Client tests
        run: node --test "tests/client/*.test.mjs"
