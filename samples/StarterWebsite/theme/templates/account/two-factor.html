{layout:layouts/main}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <h1 class="h3 mb-3">Two-factor sign-in</h1>
    <p>Open your authenticator app and enter the current code.</p>
    {form:two-factor}
    <button type="button" class="btn btn-outline-primary w-100 mt-2" data-wl-passkey="verify"
      data-wl-passkey-begin="/account/passkeys/two-factor/begin" data-wl-passkey-finish="/account/passkeys/two-factor/finish?returnUrl={model:returnUrl|urlencode}">Use a passkey instead</button>
    <p class="mt-3 small">Lost your phone? <a href="/account/recovery-code">Use a recovery code</a></p>
  </div>
</div>
