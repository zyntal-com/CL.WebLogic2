{layout:layouts/main}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <h1 class="h3 mb-3">Forgot your password?</h1>
    {if:model:sent}
    <div class="alert alert-info">If an account uses that address, a reset link is on its way. It expires after an hour and works once.</div>
    {else}
    <p>Enter the address you registered with and we will e-mail you a link.</p>
    {form:forgot-password}
    {/if}
  </div>
</div>
